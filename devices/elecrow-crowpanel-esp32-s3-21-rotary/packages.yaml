substitutions:
  # Display rotation in degrees: 0, 90, 180, or 270
  # Rotate to match your preferred mounting orientation / USB cable direction
  display_rotation: "0"

  # Rotary knob: volume step per detent (percent), and direction.
  # Set knob_direction to "-1" if clockwise turns the volume down.
  knob_volume_step: "2"
  knob_direction: "1"

  # Device profile
  screen_width: "480"
  screen_height: "480"
  artwork_size: "480"
  artwork_display_size: "480"
  clock_cx: "240"
  clock_cy: "240"
  device_slug: "elecrow-crowpanel-esp32-s3-21-rotary"
  firmware_manifest_slug: "crowpanel-21-rotary"
  post_artwork_script: "start_hide_track_info_timer"
  track_info_duration_default: "5"
  pause_lvgl_on_screen_off: "true"
  clock_screensaver_supported: "true"
  idle_action_default: "Clock"
  button_control_radius: "48px"
  button_arc_width: "12"
  button_knob_radius: "14"
  # Round panel: the bottom rows sit behind the bezel, so lift the progress bar
  # into the visible circle (matches the layout in device/lvgl.yaml).
  progress_bar_align_y: "-24"

  # Setup screens
  # Round panel: keep setup text inside the visible circle.
  setup_content_width: "340"
  setup_pad_row: "16"
  setup_instructions_pad_top: "8"
  setup_icon_font: "$icon_font"
  setup_button_width: "180"
  setup_button_height: "44"
  setup_button_radius: "22"
  setup_button_font: "roboto19_font"
  loading_pad_row: "16"
  loading_bar_width: "80"
  loading_bar_height: "4"
  loading_bar_radius: "3"
  loading_bar_pad_top: "24"

packages:
  # Common
  base: !include ../../common/device/base.yaml
  web_settings: !include ../../common/addon/web_settings.yaml

  # Device-specific
  device: !include device/device.yaml
  web_activity: !include device/web_activity.yaml
  lvgl: !include device/lvgl.yaml
  fonts: !include assets/fonts.yaml
  icons: !include assets/icons.yaml
  button: !include ../../common/theme/button.yaml
