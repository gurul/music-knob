# Elecrow CrowPanel 2.1" Rotary Music Knob
substitutions:
  name: "music-knob"
  friendly_name: "Music Knob"
  # ha_host: "homeassistant.local"  # Home Assistant hostname or IP (change if HA runs on a different host)
  # ha_port: "8123"  # Home Assistant port (change if HA runs on a non-standard port)

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

# Wifi Setup
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Packages
packages:
  music_dashboard:
    url: https://github.com/gurul/music-knob
    files: [devices/elecrow-crowpanel-esp32-s3-21-rotary/packages.yaml]
    ref: main
    refresh: 1s
